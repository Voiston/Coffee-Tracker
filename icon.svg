<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fond élégant sombre aux reflets café / laiton -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="45%" stop-color="#0E1424"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>

    <!-- Halo doré subtil derrière la tasse -->
    <radialGradient id="cup-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(229, 184, 66, 0.22)"/>
      <stop offset="60%" stop-color="rgba(229, 184, 66, 0.05)"/>
      <stop offset="100%" stop-color="rgba(229, 184, 66, 0)"/>
    </radialGradient>

    <!-- Ombre douce sous le symbole -->
    <filter id="subtle-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(229, 184, 66, 0.3)" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fond -->
  
      <rect width="512" height="512" rx="116" fill="url(#bg-gradient)"/>
      <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
      <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>
    

  <!-- Halo lumineux -->
  <circle cx="256" cy="256" r="170" fill="url(#cup-glow)"/>

  <!-- Tasse à café (SVG demandé) -->
  <g transform="translate(256, 256) scale(13) translate(-12.5, -11)" filter="url(#subtle-shadow)">
    <path d="M18 8h1a4 4 0 0 1 0 8h-1" fill="none" stroke="#E5B842" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z" fill="none" stroke="#E5B842" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="6" y1="1" x2="6" y2="4" stroke="#E5B842" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="10" y1="1" x2="10" y2="4" stroke="#E5B842" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="14" y1="1" x2="14" y2="4" stroke="#E5B842" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>