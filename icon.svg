<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fond espresso profond et chaud -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181411"/>
      <stop offset="45%" stop-color="#120E0C"/>
      <stop offset="100%" stop-color="#0A0807"/>
    </linearGradient>

    <!-- Dégradé or ambré chaud (côté actif / lumière) -->
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Dégradé torréfaction sombre / bronze satiné (côté ombre) -->
    <linearGradient id="bronze-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="30%" stop-color="#451A03"/>
      <stop offset="75%" stop-color="#2D1104"/>
      <stop offset="100%" stop-color="#1A0A02"/>
    </linearGradient>

    <!-- Dégradé de la ligne médiane / sillage métabolique -->
    <linearGradient id="crease-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Ombre portée douce et réaliste sous le symbole -->
    <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Fin biseau intérieur sur le lobe d'or -->
    <linearGradient id="specular-rim" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.3)"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  
      <rect width="512" height="512" rx="116" fill="url(#bg-gradient)"/>
      <!-- Fin liséré biseauté subtil pour les écrans Retina -->
      <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
      <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="1.5"/>
    

  <!-- Symbole Central : Grain de Café Minimaliste & Cinétique -->
  <g transform="translate(256, 256) scale(0.88)" filter="url(#subtle-shadow)">
    
    <!-- Anneau de mesure métabolique ultra-fin (Élégance horlogère suisse) -->
    <circle cx="0" cy="0" r="172" fill="none" stroke="rgba(245, 158, 11, 0.12)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="172" fill="none" stroke="url(#gold-bright)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="100 980" stroke-dashoffset="65"/>

    <!-- Index discrets à 12h, 3h, 6h, 9h -->
    <line x1="0" y1="-172" x2="0" y2="-164" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2" stroke-linecap="round"/>
    <line x1="172" y1="0" x2="164" y2="0" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="172" x2="0" y2="164" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-172" y1="0" x2="-164" y2="0" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Cœur : Le Grain sculpté à 28° d'inclinaison -->
    <g transform="rotate(-26)">
      <!-- LOBE GAUCHE (Torréfaction profonde & ombre physique) -->
      <!-- Forme aérodynamique pure, fente S-curve fluide -->
      <path d="
        M -6 -128
        C -48 -124 -92 -88 -104 -32
        C -114 18 -98 76 -62 108
        C -40 126 -18 132 -6 128
        C -8 88 -24 38 -20 -10
        C -16 -58 -8 -96 -6 -128
        Z
      " fill="url(#bronze-deep)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

      <!-- Rehaut d'ombre au cœur de la fente gauche -->
      <path d="
        M -6 -128
        C -8 -96 -16 -58 -20 -10
        C -24 38 -8 88 -6 128
        C -12 120 -24 75 -22 0
        C -20 -60 -10 -115 -6 -128
        Z
      " fill="rgba(0,0,0,0.4)"/>

      <!-- LOBE DROIT (Énergie active, Crématdor, Lumière directe) -->
      <path d="
        M 6 -128
        C 8 -96 16 -58 20 -10
        C 24 38 8 88 6 128
        C 18 132 40 126 62 108
        C 98 76 114 18 104 -32
        C 92 -88 48 -124 6 -128
        Z
      " fill="url(#gold-bright)" stroke="url(#specular-rim)" stroke-width="1.5"/>

      <!-- Reflet satiné supérieur sur le lobe droit -->
      <path d="
        M 18 -118
        C 48 -112 84 -82 92 -36
        C 96 -6 88 28 72 58
        C 76 22 84 -16 78 -46
        C 70 -80 44 -104 18 -118
        Z
      " fill="rgba(255,255,255,0.18)"/>

      <!-- S-CURVE CENTRALE (Fissure iconique du grain / Dynamisme) -->
      <path d="
        M 0 -130
        C -4 -85 -14 -42 -12 0
        C -10 46 8 85 0 130
      " fill="none" stroke="url(#crease-light)" stroke-width="4.5" stroke-linecap="round"/>

      <!-- Étincelle de pureté au point d'inflexion (centre de gravité métabolique) -->
      <circle cx="-1" cy="4" r="3" fill="#FFFBEB"/>
    </g>

  </g>
</svg>